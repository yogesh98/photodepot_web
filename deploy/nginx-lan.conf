# Keep the original browser protocol when an outer proxy terminates TLS.
map $http_x_forwarded_proto $photodepot_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 16k;

    # Every request, including installers, passes through Next's access guard.
    # Never add a root/alias for public/downloads here.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $photodepot_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
